services:
  postgres:
    image: postgres:18.1-alpine
    command: ["postgres", "-c", "log_statement=all"]
    environment:
      POSTGRES_DB: kotlin-spring-boot-template
      POSTGRES_USER: root
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U root -d kotlin-spring-boot-template"]
      interval: 10s
      timeout: 3s
      retries: 5
